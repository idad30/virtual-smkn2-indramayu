<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#102b43">
  <title>Kampus 3D - Virtual SMKN 2 Indramayu</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc8dc;touch-action:none}
    #game{position:fixed;inset:0} #game canvas{display:block;width:100%;height:100%}
    .top-panel{position:fixed;top:14px;left:14px;z-index:5;max-width:min(300px,calc(100vw - 28px));padding:13px 16px;border:1px solid #d4af37;border-radius:14px;background:rgba(9,27,42,.9);color:#fff;font:12px/1.65 Arial,sans-serif;box-shadow:0 5px 22px #0003;backdrop-filter:blur(8px)}
    .top-panel b{display:block;color:#e8bd58;font-size:13px;letter-spacing:.7px;margin-bottom:3px}
    .top-panel a{color:#9edcf5;text-decoration:none;font-weight:bold}
    .student-card{position:fixed;right:14px;top:14px;z-index:6;display:grid;gap:5px;width:min(230px,calc(100vw - 28px));padding:12px 14px;border:1px solid #d4af37;border-radius:13px;background:rgba(12,35,55,.94);color:#fff;font:12px/1.5 Arial,sans-serif;box-shadow:0 5px 22px #0003}
    .student-card b{color:#e4b84f;letter-spacing:1px;font-size:11px}.student-card strong{font-size:14px;overflow-wrap:anywhere}
    .mobile-controls{display:none;position:fixed;inset:auto 0 18px;z-index:8;align-items:end;justify-content:space-between;padding:0 20px;pointer-events:none}
    #joystick{width:124px;height:124px;border:2px solid #ffffff99;border-radius:50%;background:#102b4380;backdrop-filter:blur(5px);position:relative;pointer-events:auto;touch-action:none}
    #stick{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#e4b84f;border:2px solid #fff;box-shadow:0 3px 10px #0005}
    .actions{display:flex;flex-direction:column;gap:10px;pointer-events:auto}
    .actions button{min-width:76px;padding:13px 12px;border:1px solid #fff8;border-radius:13px;background:#102b43df;color:#fff;font-weight:bold;box-shadow:0 4px 12px #0004;touch-action:manipulation}
    .actions button.active{background:#b27d1b}
    @media(max-width:700px){.mobile-controls{display:flex}.top-panel{top:10px;left:10px;padding:10px 12px;font-size:10px;max-width:190px}.top-panel b{font-size:11px}.student-card{top:10px;right:10px;width:min(175px,calc(100vw - 210px));padding:9px;font-size:10px}.student-card strong{font-size:12px}}
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="top-panel">
    <b>VIRTUAL SMKN 2 INDRAMAYU</b>
    WASD / panah: bergerak · E: interaksi gedung · Double klik: kunci mouse · Scroll: zoom
    <br><a href="index.html">← Kembali ke halaman utama</a>
    <br><span>Double klik area permainan untuk menyembunyikan kursor. Tekan ESC untuk melepasnya.</span><br><span>Dekati gedung lalu tekan E untuk informasi.</span><br><span>Denah 3D masih berupa ilustrasi.</span>
  </div>
  <div class="mobile-controls">
    <div id="joystick" aria-label="Joystick gerak"><div id="stick"></div></div>
    <div class="actions"><button id="jump" type="button">LOMPAT</button><button id="run" type="button">LARI</button></div>
  </div>
  <script type="module" src="campus.js"></script>
</body>
</html>
